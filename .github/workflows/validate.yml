# ref: ../REFERENCES.md — web-fetch latest action versions before use (L11/L24); Renovate updates pins
name: validate
on: { pull_request: { branches: [main] }, push: { branches: [main] } }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: bash ./scripts/check-loc.sh
      - run: bash ./scripts/check-ai-pattern.sh
      - run: bash ./scripts/check-agentic-traces.sh
      - run: pnpm commitlint --from=origin/main --to=HEAD --verbose
        if: github.event_name == 'pull_request'
